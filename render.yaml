services:
  - type: web
    name: md-ashik-portfolio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0
    healthCheckPath: /en
    autoDeployTrigger: commit
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
